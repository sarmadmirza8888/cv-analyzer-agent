name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the light dependencies: tests that need LangChain or MLflow skip themselves.
      - run: pip install pytest numpy
      - run: pytest -q
